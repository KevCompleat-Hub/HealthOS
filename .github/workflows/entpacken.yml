name: ZIP-Paket entpacken
# Entpackt ein hochgeladenes HealthOS-ZIP-Paket, prüft alle SHA-256-Prüfsummen und checkt den Inhalt ein.
# Ablauf: ZIP über "Add file > Upload files" ins Hauptverzeichnis hochladen. Der Rest läuft automatisch.
on:
  push:
    branches: [main]
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  entpacken:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Paket entpacken und Prüfsummen kontrollieren
        run: |
          set -e
          ZIP=$(ls -t *.zip 2>/dev/null | head -1 || true)
          if [ -z "$ZIP" ]; then echo "Kein ZIP-Paket gefunden, nichts zu tun."; exit 0; fi
          echo "Entpacke $ZIP"
          unzip -o -q "$ZIP" -d .
          sha256sum -c --quiet PRUEFSUMMEN.txt
          echo "Alle Prüfsummen stimmen."
          git rm -q --cached "$ZIP" 2>/dev/null || true
          rm -f "$ZIP"
      - name: Einchecken
        run: |
          git config user.name "healthos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Code aus ZIP-Paket entpackt, Prüfsummen geprüft" || echo "Keine Änderungen"
          git push
